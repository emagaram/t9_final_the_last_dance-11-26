[package]
name = "t9_project"
version = "0.1.0"
edition = "2021"
default-run = "t9_project"

[profile.dev]
opt-level = 0
debug = true

[profile.dev-opt]
inherits = "dev"
opt-level = 3
debug = false
debug-assertions = true

[profile.release]
debug = false

[[bench]]
name = "micromap"
harness = false
[[bench]]
name = "count_vs_count_ones"
harness = false
[[bench]]
name = "process_tasks"
harness = false
[[bench]]
name = "compression"
harness = false

[dependencies]
aws-config = "1.13.3"
aws-sdk-s3 = "1.161.0"
bincode = "2.0.1"
boomphf = "0.6.0"
brotli = "9.1.3"
chrono = "0.4.45"
criterion = "0.8.2"
crossbeam = "0.8.5"
crossbeam-channel = "0.5.17"
dashmap = "6.2.1"
fxhash = "0.2.1"
gxhash = "3.5.0"
hashbrown = "0.17.2"
itertools = "0.15.0"
lazy_static = "1.5.1"
micromap = "0.3.0"
nix = "0.32.0"
num_cpus = "1.17.0"
once_cell = "1.21.4"
ordered-float = "5.5.1"
parking_lot = "0.13.0"
rand = "0.10.4"
rayon = "1.12.0"
reqwest = "0.13.5"
rustc-hash = "2.1.3"
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smallvec = "1.16.6"
sysinfo = "0.40.4"
tempfile = "3.27.0"
thread_local = "1.1.10"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-tree = "0.4.1"


# [features]
# io-uring = ["dep:io-uring"]
